name: Python formatting & testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black pytest ruff
        pip install -r requirements.txt

    - name: lint
      run: |
        black --check .
        ruff .

    - name: test
      run: pytest
