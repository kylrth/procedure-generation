[tool.black]
line-length = 100

[tool.ruff]
select = ["A", "B", "C", "E", "F", "I", "N", "Q", "S", "T", "W", "ARG", "BLE", "DJ", "DTZ", "EM", "ERA", "EXE", "ICN", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "TCH", "TID", "TRY", "UP", "YTT"]
ignore = ["EM101", "PLR0913", "PT009", "TRY003"]
line-length = 100

[tool.ruff.per-file-ignores]
# Scripts need to print.
"embed.py" = ["T201"]
"run.py" = ["T201"]

[tool.ruff.isort]
lines-after-imports = 2
